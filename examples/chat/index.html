<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>sigx ai — chat</title>
        <style>
            :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
            body { margin: 0; background: Canvas; color: CanvasText; }
            main { max-width: 44rem; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; }
            header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
            header small { opacity: 0.7; }
            .thread { flex: 1; display: flex; flex-direction: column; gap: 0.75rem; padding: 1rem 0; }
            .msg { padding: 0.6rem 0.9rem; border-radius: 0.75rem; max-width: 85%; white-space: pre-wrap; line-height: 1.45; }
            .msg.user { align-self: flex-end; background: Highlight; color: HighlightText; }
            .msg.assistant { align-self: flex-start; background: color-mix(in srgb, CanvasText 8%, Canvas); }
            .reasoning { opacity: 0.6; font-size: 0.85em; font-style: italic; }
            .tool { display: block; font-family: ui-monospace, monospace; font-size: 0.8em; margin: 0.3rem 0; padding: 0.4rem 0.6rem; border-left: 3px solid Highlight; background: color-mix(in srgb, CanvasText 5%, Canvas); }
            .tool.streaming, .tool.pending { border-color: GrayText; }
            .tool.error, .tool.denied { border-color: crimson; }
            .tool.awaiting { border-color: orange; }
            .approval { font-size: 0.9em; }
            /* Assistant text is markdown, rendered by `RichTextView` (`@sigx/richtext/dom`). The view ships no CSS:
               every element carries data-scope="richtext" data-part="<name>", so a
               stylesheet targets those and nothing else. The bubble's pre-wrap is
               for tool/reasoning parts; blocks manage their own whitespace. */
            .md { white-space: normal; }
            .md.live [data-scope=richtext][data-part=root] > :last-child::after { content: '▍'; animation: blink 1s steps(2) infinite; }
            .md.live [data-scope=richtext][data-part=root]:empty::after { content: '▍'; animation: blink 1s steps(2) infinite; }
            @keyframes blink { 50% { opacity: 0; } }
            [data-scope=richtext][data-part=root] { line-height: 1.5; overflow-wrap: break-word; }
            [data-scope=richtext][data-part=root] > :first-child { margin-top: 0; }
            [data-scope=richtext][data-part=root] > :last-child { margin-bottom: 0; }
            [data-scope=richtext][data-part=paragraph] { margin: 0 0 0.75em; }
            [data-scope=richtext][data-part=heading] { margin: 1em 0 0.4em; line-height: 1.25; }
            [data-scope=richtext][data-part=list] { margin: 0 0 0.75em; padding-left: 1.5em; }
            [data-scope=richtext][data-part=list-item] { margin: 0.2em 0; }
            [data-scope=richtext][data-part=blockquote] { margin: 0 0 0.75em; padding: 0 0.8em; border-left: 3px solid GrayText; opacity: 0.85; }
            [data-scope=richtext][data-part=link] { color: LinkText; }
            [data-scope=richtext][data-part=inline-code] { font-family: ui-monospace, monospace; font-size: 0.9em; padding: 0.1em 0.3em; border-radius: 0.3em; background: color-mix(in srgb, CanvasText 10%, Canvas); }
            [data-scope=richtext][data-part=code] { margin: 0 0 0.75em; border-radius: 0.5rem; background: color-mix(in srgb, CanvasText 6%, Canvas); border: 1px solid color-mix(in srgb, CanvasText 15%, Canvas); overflow: hidden; }
            [data-scope=richtext][data-part=code-header] { display: flex; justify-content: space-between; padding: 0.25rem 0.6rem; font-size: 0.75em; opacity: 0.75; border-bottom: 1px solid color-mix(in srgb, CanvasText 10%, Canvas); }
            [data-scope=richtext][data-part=copy] { font: inherit; padding: 0; border: 0; background: none; color: inherit; cursor: pointer; }
            [data-scope=richtext][data-part=pre] { margin: 0; padding: 0.6rem; overflow-x: auto; font-family: ui-monospace, monospace; font-size: 0.85em; line-height: 1.4; }
            [data-scope=richtext][data-part=table] { border-collapse: collapse; margin: 0 0 0.75em; font-size: 0.95em; }
            [data-scope=richtext][data-part=table-cell] { padding: 0.3em 0.6em; border: 1px solid color-mix(in srgb, CanvasText 20%, Canvas); }
            [data-scope=richtext][data-part=table-head] [data-part=table-cell] { background: color-mix(in srgb, CanvasText 6%, Canvas); font-weight: 600; }
            [data-scope=richtext][data-part=thematic-break] { border: 0; border-top: 1px solid color-mix(in srgb, CanvasText 20%, Canvas); margin: 0.75em 0; }
            form { display: flex; gap: 0.5rem; padding-bottom: 1rem; }
            textarea { flex: 1; resize: none; font: inherit; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid GrayText; background: Field; color: FieldText; }
            button { font: inherit; padding: 0.6rem 1rem; border-radius: 0.5rem; border: 1px solid GrayText; background: ButtonFace; color: ButtonText; cursor: pointer; }
            button:disabled { opacity: 0.5; cursor: default; }
            .error { color: crimson; }
        </style>
    </head>
    <body>
        <div id="app"><!--ssr-outlet--></div>
        <script type="module" src="/src/entry-client.tsx"></script>
    </body>
</html>
