<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>sigx ai — agent</title>
        <style>
            :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
            body { margin: 0; background: Canvas; color: CanvasText; }
            main { max-width: 46rem; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; }
            header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
            header h1 { font-size: 1.1rem; margin: 0; }
            header small { opacity: 0.7; font-variant-numeric: tabular-nums; }
            .thread { flex: 1; display: flex; flex-direction: column; gap: 0.75rem; padding: 1rem 0; }
            .hint { opacity: 0.6; }
            .msg { padding: 0.6rem 0.9rem; border-radius: 0.75rem; max-width: 90%; white-space: pre-wrap; line-height: 1.45; }
            .msg.user { align-self: flex-end; background: Highlight; color: HighlightText; }
            .msg.assistant { align-self: flex-start; background: color-mix(in srgb, CanvasText 8%, Canvas); width: 100%; box-sizing: border-box; }
            .reasoning { opacity: 0.6; font-size: 0.85em; font-style: italic; }
            /* A tool CARD: the call, its status, its output, and — while it is
               waiting — the permission prompt, in place. */
            .tool { display: block; margin: 0.4rem 0; padding: 0.5rem 0.7rem; border-left: 3px solid GrayText; border-radius: 0.4rem; background: color-mix(in srgb, CanvasText 5%, Canvas); white-space: normal; }
            .tool.in_progress { border-color: Highlight; }
            .tool.completed { border-color: seagreen; }
            .tool.failed, .tool.denied, .tool.cancelled { border-color: crimson; }
            .tool-head { display: block; font-family: ui-monospace, monospace; font-size: 0.82em; overflow-wrap: anywhere; }
            .tool-status { font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; }
            /* The full call input, folded away — the header carries the signature. */
            .tool-input { font-size: 0.78em; }
            .tool-input > summary { cursor: pointer; opacity: 0.7; }
            /* `pre-wrap`, not a horizontal scrollbar: the whole point of a
               <pre> here is that a shell listing keeps its newlines. */
            .tool-output, .tool-input > pre { margin: 0.4rem 0 0; padding: 0.4rem 0.6rem; border-radius: 0.3rem; background: color-mix(in srgb, CanvasText 8%, Canvas); font-family: ui-monospace, monospace; font-size: 0.78em; white-space: pre-wrap; overflow-wrap: anywhere; }
            .tool-input > pre { font-size: 1em; }
            .tool-error { color: crimson; font-size: 0.82em; }
            .ask { margin: 0.5rem 0 0; font-size: 0.9em; }
            .ask code { font-family: ui-monospace, monospace; }
            .attachment { font-family: ui-monospace, monospace; font-size: 0.8em; }
            form { display: flex; gap: 0.5rem; padding-bottom: 1rem; }
            textarea { flex: 1; resize: none; font: inherit; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid GrayText; background: Field; color: FieldText; }
            button { font: inherit; padding: 0.6rem 1rem; border-radius: 0.5rem; border: 1px solid GrayText; background: ButtonFace; color: ButtonText; cursor: pointer; }
            button:disabled { opacity: 0.5; cursor: default; }
            .error { color: crimson; }
        </style>
    </head>
    <body>
        <div id="app"><!--ssr-outlet--></div>
        <script type="module" src="/src/entry-client.tsx"></script>
    </body>
</html>
