<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>sigx ai — agent playground</title>
        <style>
            :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
            body { margin: 0; background: Canvas; color: CanvasText; }
            /* Sidebar + panes. The sidebar is the session list; the pane is
               what the single-session version used to be, N times over. */
            main.layout { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 1rem; padding: 1rem; min-height: 100vh; box-sizing: border-box; align-items: start; }
            @media (max-width: 52rem) { main.layout { grid-template-columns: 1fr; } }
            .sidebar { position: sticky; top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
            .sidebar h1 { font-size: 1rem; margin: 0 0 0.3rem; }
            .panes { display: flex; flex-direction: column; min-height: 100vh; }
            /* Side by side: every pane at once, for comparing two agents on
               the same prompt. */
            main.compare .panes { display: grid; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); gap: 1rem; align-items: start; }
            .pane { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 100vh; }
            /* `display` on .pane overrides the UA stylesheet's
               `[hidden] { display: none }`, so a hidden pane would render
               anyway and every session would stack down the page. Any rule
               that sets `display` on an element you also toggle with `hidden`
               needs this. */
            .pane[hidden] { display: none; }
            main.compare .pane { min-height: 0; border: 1px solid color-mix(in srgb, CanvasText 15%, Canvas); border-radius: 0.6rem; padding: 0 0.8rem; }
            .session-row { display: flex; align-items: stretch; gap: 0.2rem; border: 1px solid color-mix(in srgb, CanvasText 15%, Canvas); border-radius: 0.5rem; overflow: hidden; }
            .session-row.selected { border-color: Highlight; background: color-mix(in srgb, Highlight 12%, Canvas); }
            .session-row.running, .session-row.awaiting { border-left: 3px solid Highlight; }
            .session-row.error { border-left: 3px solid crimson; }
            .session-row.opening { border-style: dashed; }
            .session-pick { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 0.1rem; border: 0; border-radius: 0; background: none; padding: 0.4rem 0.6rem; text-align: left; }
            .session-name { font-size: 0.88em; }
            .session-meta { font-size: 0.72em; opacity: 0.65; overflow-wrap: anywhere; }
            .session-close { border: 0; border-radius: 0; background: none; padding: 0 0.5rem; opacity: 0.5; }
            .session-close:hover { opacity: 1; color: crimson; }
            .compare-toggle { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8em; opacity: 0.8; }
            .new-session { padding: 0.6rem; border: 1px dashed GrayText; border-radius: 0.5rem; margin-top: 0.3rem; }
            .new-session fieldset { display: flex; flex-direction: column; gap: 0.4rem; border: 0; padding: 0; margin: 0; min-width: 0; }
            .new-session label, .config label { display: flex; flex-direction: column; gap: 0.15rem; font-size: 0.78em; }
            .new-session select, .new-session input, .config select { font: inherit; font-size: 0.95em; padding: 0.25rem 0.35rem; border-radius: 0.35rem; border: 1px solid GrayText; background: Field; color: FieldText; max-width: 100%; }
            .new-session button { padding: 0.35rem 0.7rem; font-size: 0.85em; }
            /* The settings a session advertises — whatever it calls them. */
            .settings { font-size: 0.85em; margin: 0.2rem 0; }
            .settings > summary { cursor: pointer; opacity: 0.7; }
            .config { display: flex; flex-wrap: wrap; gap: 0.6rem; padding: 0.5rem 0 0; }
            .config-note { font-size: 0.78em; opacity: 0.6; margin: 0.4rem 0 0; flex-basis: 100%; }
            header small .model { opacity: 0.7; font-weight: normal; }
            header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
            header h1 { font-size: 1.1rem; margin: 0; }
            header small { opacity: 0.7; font-variant-numeric: tabular-nums; }
            .thread { flex: 1 1 auto; display: flex; flex-direction: column; gap: 0.75rem; padding: 1rem 0; }
            .hint { opacity: 0.6; }
            .msg { padding: 0.6rem 0.9rem; border-radius: 0.75rem; max-width: 90%; white-space: pre-wrap; line-height: 1.45; }
            .msg.user { align-self: flex-end; background: Highlight; color: HighlightText; }
            .msg.assistant { align-self: flex-start; background: color-mix(in srgb, CanvasText 8%, Canvas); width: 100%; box-sizing: border-box; }
            /* Reasoning: the text when there is any, and — while a harness that
               redacts it is still thinking — a live indicator instead of a
               blank thread. */
            .reasoning { opacity: 0.6; font-size: 0.85em; font-style: italic; }
            .reasoning > summary { cursor: pointer; font-style: normal; }
            .reasoning.thinking::after { content: ''; display: inline-block; width: 0.5em; height: 0.5em; margin-left: 0.4em; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }
            @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
            @media (prefers-reduced-motion: reduce) { .reasoning.thinking::after { animation: none; opacity: 0.6; } }
            /* A tool CARD: the call, its status, its output, and — while it is
               waiting — the permission prompt, in place. */
            .tool { display: block; margin: 0.4rem 0; padding: 0.5rem 0.7rem; border-left: 3px solid GrayText; border-radius: 0.4rem; background: color-mix(in srgb, CanvasText 5%, Canvas); white-space: normal; }
            .tool.in_progress { border-color: Highlight; }
            /* Still being written — dashed, so it reads as unfinished rather than as running. */
            .tool.streaming { border-color: Highlight; border-left-style: dashed; }
            .tool.completed { border-color: seagreen; }
            .tool.failed, .tool.denied, .tool.cancelled { border-color: crimson; }
            .tool-head { display: block; font-family: ui-monospace, monospace; font-size: 0.82em; overflow-wrap: anywhere; }
            .tool-status { font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; }
            /* The full call input, folded away — the header carries the signature. */
            .tool-input { font-size: 0.78em; }
            .tool-input > summary { cursor: pointer; opacity: 0.7; }
            /* `pre-wrap`, not a horizontal scrollbar: the whole point of a
               <pre> here is that a shell listing keeps its newlines. */
            .tool-output, .tool-input > pre { margin: 0.4rem 0 0; padding: 0.4rem 0.6rem; border-radius: 0.3rem; background: color-mix(in srgb, CanvasText 8%, Canvas); font-family: ui-monospace, monospace; font-size: 0.78em; white-space: pre-wrap; overflow-wrap: anywhere; }
            .tool-input > pre { font-size: 1em; }
            /* A call that returned NOTHING: one dim word, inline — an empty
               <pre> would be a padded grey rectangle saying nothing (#128). */
            .tool-empty { font-size: 0.78em; font-style: italic; opacity: 0.55; }
            .tool-error { color: crimson; font-size: 0.82em; }
            /* A SUB-AGENT card, under the tool card whose call spawned it: its
               status, and its own messages — open while it works, folded once
               it is done. A nested agent sits one card deeper. */
            .agent { margin: 0.5rem 0 0 0.6rem; padding: 0.4rem 0.6rem; border-left: 3px dashed GrayText; border-radius: 0.4rem; background: color-mix(in srgb, CanvasText 4%, Canvas); }
            .agent.running, .agent.paused { border-color: Highlight; }
            .agent.completed { border-color: seagreen; }
            .agent.failed, .agent.cancelled { border-color: crimson; }
            .agent-head { display: flex; align-items: baseline; gap: 0.5rem; font-size: 0.85em; }
            .agent-status { font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; }
            .agent.running .agent-status::after { content: ''; display: inline-block; width: 0.45em; height: 0.45em; margin-left: 0.35em; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }
            @media (prefers-reduced-motion: reduce) { .agent.running .agent-status::after { animation: none; } }
            .agent-head button { margin-left: auto; padding: 0.15rem 0.6rem; font-size: 0.9em; }
            .agent-summary { margin: 0.25rem 0 0; font-size: 0.82em; opacity: 0.75; }
            .agent-work { margin-top: 0.3rem; }
            .agent-work > summary { cursor: pointer; opacity: 0.7; font-size: 0.8em; }
            .agent-work .msg { max-width: 100%; padding: 0.4rem 0.6rem; margin-top: 0.3rem; }
            .ask { margin: 0.5rem 0 0; font-size: 0.9em; }
            .ask code { font-family: ui-monospace, monospace; }
            /* An input request: one fieldset per question, answered in one go. */
            form.ask { display: block; padding-bottom: 0; }
            .question { margin: 0 0 0.5rem; padding: 0.4rem 0.7rem; border: 1px solid GrayText; border-radius: 0.4rem; }
            .question legend { font-weight: 600; padding: 0 0.3rem; }
            .question-text { margin: 0 0 0.4rem; opacity: 0.75; }
            .question label { display: block; padding: 0.1rem 0; cursor: pointer; }
            .question input[type='text'] { width: 100%; box-sizing: border-box; margin-top: 0.3rem; font: inherit; padding: 0.35rem 0.5rem; border-radius: 0.35rem; border: 1px solid GrayText; background: Field; color: FieldText; }
            .attachment { font-family: ui-monospace, monospace; font-size: 0.8em; }
            form { display: flex; gap: 0.5rem; padding-bottom: 1rem; }
            textarea { flex: 1; resize: none; font: inherit; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid GrayText; background: Field; color: FieldText; }
            button { font: inherit; padding: 0.6rem 1rem; border-radius: 0.5rem; border: 1px solid GrayText; background: ButtonFace; color: ButtonText; cursor: pointer; }
            button:disabled { opacity: 0.5; cursor: default; }
            .error { color: crimson; }
        </style>
    </head>
    <body>
        <div id="app"><!--ssr-outlet--></div>
        <script type="module" src="/src/entry-client.tsx"></script>
    </body>
</html>
